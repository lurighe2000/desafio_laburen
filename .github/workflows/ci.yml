name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  token-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci
      - name: Check WHATSAPP token
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WABA_ID: '807524341770906'
        run: node scripts/check_token.js
